name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  quality:
    name: ktlint and Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run ktlint and Detekt
        run: bash gradlew ktlintCheck detekt

  test:
    name: Test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run tests
        run: bash gradlew test

  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build debug APK
        run: bash gradlew android:assembleDebug

      - name: Upload Android build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rollbound-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-desktop:
    name: Build desktop
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build desktop JAR
        run: bash gradlew lwjgl3:jar

      - name: Upload desktop build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rollbound-desktop
          path: lwjgl3/build/libs/*.jar
          if-no-files-found: error
